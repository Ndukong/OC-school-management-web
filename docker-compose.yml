# Full-stack deployment: Django + PostgreSQL + Caddy (automatic HTTPS).
#
# Usage on a fresh VPS (Ubuntu 22.04/24.04, 2GB+ RAM recommended):
#   1. Install Docker:  curl -fsSL https://get.docker.com | sh
#   2. cp .env.example .env   and fill in the secrets (see below)
#   3. Edit the Caddy hostname line to your domain
#   4. docker compose up -d --build
#
# Media: set USE_S3=true + the R2 values to keep uploads off the server disk.
# Without S3, uploaded media lives in the `media/` volume (included).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolms
      POSTGRES_USER: schoolms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolms"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      LICENSE_SECRET_KEY: ${LICENSE_SECRET_KEY:?set LICENSE_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
      DATABASE_URL: postgres://schoolms:${POSTGRES_PASSWORD}@db:5432/schoolms
      GUNICORN_WORKERS: "3"
      USE_S3: ${USE_S3:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
    volumes:
      - media_data:/app/media
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config: