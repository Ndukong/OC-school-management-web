<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - School Management</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.08); padding: 32px; max-width: 400px; width: 100%; }
.card h4 { margin: 0 0 20px; text-align: center; color: #1f4e78; }
.field { margin-bottom: 16px; }
.field label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #2d3a47; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
.field input:focus { outline: none; border-color: #2f6a9e; box-shadow: 0 0 0 3px rgba(31,78,120,.15); }
.btn { display: block; width: 100%; padding: 12px; background: #1f4e78; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn:hover { background: #163a5c; }
.alert { background: #fdecec; border: 1px solid #f0c4c4; color: #a03232; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
.footer { text-align: center; margin-top: 16px; font-size: 12px; color: #6b7785; }
</style>
</head>
<body>
<div class="card">
    <h4>School Management Login</h4>
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus>
        </div>
        <div class="field">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        {% if form.errors %}
            <div class="alert">Invalid username or password.</div>
        {% endif %}
        <button type="submit" class="btn">Login</button>
    </form>
    <div class="footer">
        <a href="/admin/" style="color:#1f4e78;">Admin Login</a>
    </div>
</div>
</body>
</html>
